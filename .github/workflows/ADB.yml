name: Android ADB

on:
  workflow_dispatch:

jobs:
  adb:
    runs-on: ubuntu-latest

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install ADB
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-tools netcat-openbsd

      - name: Restore ADB Key
        run: |
          mkdir -p ~/.android
          printf "%s" "${{ secrets.ADB_PRIVATE_KEY }}" > ~/.android/adbkey
          chmod 600 ~/.android/adbkey

      - name: Restart ADB
        run: |
          adb kill-server || true
          adb start-server

      - name: Check Connectivity
        run: |
          ping -c 3 100.78.43.75 || true
          nc -vz 100.78.43.75 5555

      - name: Connect Device
        run: |
          adb connect 100.78.43.75:5555
          adb devices -l

      - name: Device Model
        run: |
          adb shell getprop ro.product.model

      - name: Android Version
        run: |
          adb shell getprop ro.build.version.release

      - name: Screenshot
        run: |
          adb exec-out screencap -p > screenshot.png

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
